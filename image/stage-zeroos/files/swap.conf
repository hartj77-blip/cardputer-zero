# ZeroOS memory: compressed RAM swap (zram) first, with a swap file on the SD
# card that zram only writes idle pages to now and then (low card wear).
# Raspberry Pi OS's rpi-swap reads this; see swap.conf(5).
[Main]
Mechanism=zram+file

[Zram]
# 512 MB RAM x 1.5 = 768 MB of swap space before compression. At a typical
# 2.5-3x ratio that costs ~260-300 MB of real RAM only when completely full.
# Upstream warns against values above 2. (measure on the unit)
RamMultiplier=1.5

[File]
# Writeback file and last-resort safety net. Fixed size so it never grows.
FixedSizeMiB=512
