# ZeroOS: first-boot speaker volume.
# WirePlumber starts a sink it has never seen at 0.064 linear (about -24 dB).
# The only gain stage here is the ES8389 DAC (the amplifier is a plain on/off
# switch), so that is close to silent on the 1 W speaker (M5 bug #262).
# 0.216 linear is 60% on the volume scale. Once the volume is changed,
# WirePlumber remembers the user's value and this default no longer applies.
wireplumber.settings = {
  device.routes.default-sink-volume = 0.216
}
