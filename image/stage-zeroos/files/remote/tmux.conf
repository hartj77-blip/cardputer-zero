# tmux for the Cardputer's 53 x 14 console. Alt+` goes back to ZeroShell
# (detach); everything keeps running. Ctrl+B is the usual prefix.
set -g default-terminal "tmux-256color"
set -g escape-time 10
set -g history-limit 2000
set -g mouse off
set -g status-style "bg=colour235,fg=colour250"
set -g status-left "#[fg=colour208]#S "
set -g status-left-length 8
set -g status-right "#[fg=colour244]Alt+` back"
set -g window-status-current-style "fg=colour208,bold"
set -g window-status-format "#I:#W"
set -g window-status-current-format "#I:#W"
bind -n M-` detach-client
# Alt+Left/Right: previous/next window, Alt+N: new window
bind -n M-Left previous-window
bind -n M-Right next-window
bind -n M-n new-window
