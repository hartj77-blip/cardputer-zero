# ZeroOS: Syncthing for a 512 MB pocket computer (docs/SYNC.md).
# Started and stopped by ZeroShell (Settings > Sync), never at boot.
[Service]
# No ~/Sync default folder; no self-upgrade (apt does that); keep the Go
# heap small and use at most two cores.
Environment=STNODEFAULTFOLDER=1 STNOUPGRADE=1 GOMEMLIMIT=48MiB GOMAXPROCS=2
Nice=10
IOSchedulingClass=idle
# earlyoom and the kernel take it before ZeroShell or the dock.
OOMScoreAdjust=300
# Options and the Notes / Documents / Recordings folders, once it answers.
ExecStartPost=-/usr/bin/zeroos-sync setup
TimeoutStartSec=120
